[package]
name = "bridge"
version = "0.1.0"
description = "Bridge — Mission Control for AI-assisted software development"
authors = ["Alex Kucera"]
license = "MIT"
repository = "https://github.com/AlexKucera/bridge"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "bridge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
portable-pty = "0.8"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
